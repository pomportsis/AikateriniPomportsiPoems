[params]
  subtitle = "Σύγχρονη ελληνική ποίηση"

# PAGES

  [params.homepage]
    preTitle = "Δωρεάν θέμα Hugo"
    title = "Magnolia"
    intro = """
### «Η ελευθερία μας κάνει καλύτερους ανθρώπους και μας βοηθά να βελτιωνόμαστε πιο γρήγορα ως συλλογική ανθρωπότητα».
___

**Ένα απλό, πλήρως παραμετροποιήσιμο και πολυγλωσσικό θέμα Hugo, σχεδιασμένο για επαγγελματίες και μικρές επιχειρήσεις**.

Έφτιαξα αυτό το θέμα με γνώμονα την απλότητα: είναι μικρό και εύκολα **παραμετροποιήσιμο, responsive, modular και πολυγλωσσικό**. Παράλληλα αφήνει χώρο για πιο βαθιά παραμετροποίηση, καθώς χρησιμοποιεί **Bootstrap** και **SCSS**.

Εδώ είναι η [σελίδα GitHub του θέματος](https://github.com/ololiuhqui/magnolia-free-hugo-theme). Αν ψάχνεις περισσότερες λεπτομέρειες, ανατρέξε εκεί — και μην ξεχάσεις να αφήσεις ένα ⭐ στο repo!

Δες τι μπορεί να κάνει αυτό το θέμα στη σελίδα χαρακτηριστικών και ένα όμορφο παράδειγμα σελίδας επικοινωνίας παρακάτω.
        """
    mainButton = "Χαρακτηριστικά"
    mainButtonRef = "/caratteristiche"
    secondButton = "Επικοινωνία"
    secondButtonRef = "/contatti"

    blogTitle = "Ενδιαφέρουσες ιστορίες"
    blogButton = "Περισσότερες ιστορίες"

