[params.services]
  title = "Χαρακτηριστικά"
  description = """Έφτιαξα αυτό το θέμα με γνώμονα την απλότητα: είναι μικρό και εύκολα παραμετροποιήσιμο, responsive, modular και πολυγλωσσικό. Παράλληλα αφήνει χώρο για πιο βαθιά παραμετροποίηση, καθώς χρησιμοποιεί Bootstrap και SCSS.
  Αυτή η σελίδα δείχνει επίσης ένα παράδειγμα του πώς μπορούν να αλλάξουν τα ονόματα των σελίδων του site: το site θα χρησιμοποιήσει το layout `services.html`, αλλά η σελίδα θα ονομάζεται "Χαρακτηριστικά" και ο σύνδεσμος θα χρησιμοποιεί το σχετικό permalink `/caratteristiche`."""
  [params.services.list]
    [params.services.list.0]
      title = "Προσαρμογή σε όλες τις συσκευές"
      description = "Το θέμα είναι πλήρως responsive και προβάλλεται άψογα σε κάθε μέγεθος οθόνης."
    [params.services.list.01]
      title = "Αρθρωτή δομή"
      description = "Κρύψτε ή εμφανίστε εύκολα ορισμένα στοιχεία μέσα από το αρχείο ρυθμίσεων."
    [params.services.list.02]
      title = "Πολυγλωσσικό"
      description = "Η προεπιλεγμένη γλώσσα περιεχομένου είναι τα Αγγλικά (μπορεί να αλλάξει), αλλά μπορείτε να προσθέσετε όσες γλώσσες θέλετε πολύ εύκολα· το θέμα περιλαμβάνει παράδειγμα και dropdown μενού για εύκολη εναλλαγή γλώσσας. Τα permalinks μπορούν να προσαρμοστούν ανά γλώσσα."
    [params.services.list.03]
      title = "Παραμετροποιήσιμο"
      description = "Το περιεχόμενο της σελίδας μπορεί να παραμετροποιηθεί μέσα από τα αρχεία ρυθμίσεων. Ορισμένες μεταβλητές μπορούν να αλλάξουν από τα αρχεία SCSS."
    [params.services.list.04]
      title = "Έτοιμο για SEO"
      description = "Κάθε σελίδα στο /content έχει *meta description* και μοναδικό *meta title* για καλύτερη και πιο εύκολη ευρετηρίαση. Το θέμα χρησιμοποιεί την εικόνα `static/img/meta-image` ως meta-image για Google, Meta και X."
    [params.services.list.05]
      title = "Ενσωματωμένο Google Analytics"
      description = "Βάλτε το Google Analytics tag σας στο αρχείο `config.toml` και θα είστε έτοιμοι να παρακολουθείτε εύκολα την απόδοση του site σας."
    [params.services.list.06]
      title = "Ενσωματωμένο Google Maps"
      description = "Η σελίδα επικοινωνίας μπορεί να παραμετροποιηθεί εύκολα με την προσθήκη ενός Google Maps link για οδηγίες προς την τοποθεσία της επιχείρησης."

