home_bio_title = "Σύντομο βιογραφικό σημείωμα"
home_bio_text = """
Πολλά από τα ποιήματά μου δημοσιεύτηκαν κατά καιρούς σε λογοτεχνικά έντυπα και ορισμένα διακρίθηκαν σε ποιητικούς διαγωνισμούς.

Συμμετείχα στην ανθολογία **77 βραβευμένων ποιητών** και στα **Φεστιβάλ Ποίησης Θεσσαλονίκης (2000–2005)**, με οκτώ ποιήματά μου.

Στον **Α’ Πανελλήνιο Ποιητικό Διαγωνισμό** στην Αρχαία Αγορά της Θάσου, το ποίημά μου  
**«Ηλιοβασίλεμα στην Καλλιράχη»** απέσπασε το **Γ’ βραβείο**.

Στις δύο ποιητικές μου συλλογές υπάρχουν ποιήματα που περίμεναν χρόνια — γιατί η ποίηση δεν έχει ηλικία.
"""

