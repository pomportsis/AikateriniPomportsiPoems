home_bio_title = "Краткая биографическая справка"
home_bio_text = """
Многие мои стихотворения публиковались в литературных изданиях, а некоторые были отмечены на поэтических конкурсах.

Я участвовала в антологии **77 награждённых поэтов** и в **Фестивалях поэзии в Салониках (2000–2005)** с восемью стихотворениями.

На **I Всегреческом поэтическом конкурсе** на Древней Агоре острова Тасос моё стихотворение  
**«Закат в Каллирахи»** получило **третью премию**.

В двух моих поэтических сборниках есть и такие стихи, которые ждали своего часа — ведь у поэзии нет возраста.
"""

