home_intro = """
Since my youth, poetry has been part of my life — for me it was and still is **an oasis for the soul**.  
Here you will find poems and books written with love, memory, and faith in enduring values.
"""

home_bio_title = "Short biographical note"
home_bio_text = """
Many of my poems have been published in literary magazines over the years, and some have been recognized in poetry competitions.

I took part in the anthology of **77 award-winning poets** and in the **Thessaloniki Poetry Festivals (2000–2005)** with eight of my poems.

At the **1st Panhellenic Poetry Competition** held at the Ancient Agora of Thasos, my poem  
**“Sunset in Kallirachi”** received the **3rd prize**.

My two poetry collections also include poems that waited for years — because poetry has no age.
"""

